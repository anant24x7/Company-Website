<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Dataweb Solutions</title>

    <link
        rel="stylesheet"
        href="./admin.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >
</head>


<body class="login-page">

    <div class="login-wrapper">

        <!-- Left Branding Section -->

        <div class="login-brand-panel">

            <div class="brand-content">

                <div class="brand-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <h1>
                    Dataweb Solutions
                </h1>

                <p>
                    Admin Management Portal
                </p>

                <div class="brand-message">
                    Manage website enquiries,
                    leads and customer interactions
                    from one secure dashboard.
                </div>

            </div>

        </div>


        <!-- Login Section -->

        <div class="login-form-panel">

            <div class="login-card">

                <div class="login-header">

                    <div class="login-logo">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <h2>
                        Dataweb Admin
                    </h2>

                    <p>
                        Sign in to manage website enquiries.
                    </p>

                </div>


                <form id="adminLoginForm">

                    <!-- Email -->

                    <div class="form-group">

                        <label for="adminEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="adminEmail"
                                placeholder="admin@dataweb.tech"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="adminPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="adminPassword"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                <i
                                    class="fa-solid fa-eye"
                                    id="passwordToggleIcon"
                                ></i>
                            </button>

                        </div>

                    </div>


                    <!-- Error / Success Message -->

                    <div
                        id="loginMessage"
                        class="login-message"
                    ></div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span>
                            Sign In
                        </span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <div class="login-footer">

                    <p>
                        <i class="fa-solid fa-shield-halved"></i>
                        Secure Admin Access
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script src="./login.js"></script>


    <script>
        const passwordToggle =
            document.getElementById("passwordToggle");

        const passwordInput =
            document.getElementById("adminPassword");

        const passwordToggleIcon =
            document.getElementById("passwordToggleIcon");


        if (passwordToggle) {

            passwordToggle.addEventListener(
                "click",
                function () {

                    const isPassword =
                        passwordInput.type === "password";

                    passwordInput.type =
                        isPassword
                            ? "text"
                            : "password";

                    passwordToggleIcon.classList.toggle(
                        "fa-eye"
                    );

                    passwordToggleIcon.classList.toggle(
                        "fa-eye-slash"
                    );

                }
            );

        }
    </script>

</body>

</html>
